    }
    .nf__code span { color: var(--color-accent); }

      margin-top: 1.5rem;
      font-size: clamp(1.125rem, 2vw, 1.5rem);
      color: var(--color-muted);
    }
    .nf__links {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 2rem;
      margin-top: 2rem;
      font-family: var(--font-label);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: .875rem;
    }
    .nf__links a { border-bottom: 1.5px solid currentColor; padding-bottom: 2px; }
    .nf__links a:hover,
    .nf__links a:focus-visible { color: var(--color-accent); }
  </style>
  <!-- Analytics (Umami, cookie-free). Counts only on data-domains, so local testing is ignored -->
